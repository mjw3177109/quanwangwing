name: SWF analysis and HTML5 checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "拳皇wing1.4.swf"
      - "FFDec/**"
      - "tools/**"
      - "tests/**"
      - "web/**"
      - "docs/**"
      - ".github/workflows/swf-analysis.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "inventory (default), deep diagnostics, scripts, or assets"
        type: choice
        options: [inventory, deep, scripts, assets]
        default: inventory

permissions:
  contents: read

concurrency:
  group: swf-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Java runtime
        run: java -version

      - name: Run HTML5 engine tests
        run: npm --prefix web test

      - name: Run structural SWF parser tests
        run: python3 -m unittest discover -s tests -v

      - name: Analyze original SWF with FFDec (bounded)
        run: python3 tools/analyze_swf.py --phase inventory --timeout 90 --output build/swf-analysis

      - name: Build traceable asset and character index
        run: python3 tools/build_asset_index.py --manifest build/swf-analysis/swf-manifest.json --output build/swf-analysis/asset-index.json

      - name: Build timeline placement, script, sound and frame-label reference map
        run: python3 tools/build_timeline_index.py --manifest build/swf-analysis/swf-manifest.json --output build/swf-analysis/timeline-index.json

      - name: Audit original sound definitions, triggers and stream structure
        run: |
          python3 tools/build_sound_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/sound-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          manifest = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          evidence = json.loads((root / "sound-evidence.json").read_text(encoding="utf-8"))
          if evidence["source_sha256"] != manifest["source"]["sha256"]:
              raise SystemExit("Sound evidence source mismatch")
          for code in (14, 15, 17, 18, 19, 45, 89):
              if evidence["sound_tag_counts"].get(str(code), 0) != manifest["tag_counts_by_code"].get(str(code), 0):
                  raise SystemExit(f"Sound tag {code} accounting mismatch")
          if evidence["define_sound_count"] != evidence["sound_tag_counts"].get("14", 0):
              raise SystemExit("Sound definition accounting mismatch")
          if evidence["start_sound_count"] != evidence["sound_tag_counts"].get("15", 0):
              raise SystemExit("StartSound accounting mismatch")
          PY

      - name: Audit script tag containers and original entry frames
        run: |
          python3 tools/build_script_entry_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/script-entry-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          m = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          d = json.loads((root / "script-entry-evidence.json").read_text(encoding="utf-8"))
          if d["source_sha256"] != m["source"]["sha256"]:
              raise SystemExit("Script entry SWF provenance mismatch")
          if d["script_container_count"] != len(m["scripts"]):
              raise SystemExit("Script container inventory mismatch")
          if sum(d["script_container_counts_by_tag"].values()) != len(d["entries"]):
              raise SystemExit("Script entry accounting mismatch")
          PY

      - name: Audit embedded DefineButton2 action containers (metadata only)
        run: |
          python3 tools/build_button_action_evidence.py --swf 拳皇wing1.4.swf --manifest build/swf-analysis/swf-manifest.json --output build/swf-analysis/button-action-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          manifest = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          result = json.loads((root / "button-action-evidence.json").read_text(encoding="utf-8"))
          if result["source_sha256"] != manifest["source"]["sha256"]:
              raise SystemExit("Button action SWF provenance mismatch")
          if result["define_button2_count"] != manifest["tag_counts_by_code"].get("34", 0):
              raise SystemExit("Button action definition coverage mismatch")
          if result["buttons_with_actions"] + result["buttons_without_actions"] != result["define_button2_count"]:
              raise SystemExit("Button action classification mismatch")
          if sum(row["embedded_action_record_count"] for row in result["buttons"]) != result["embedded_action_record_count"]:
              raise SystemExit("Button action record accounting mismatch")
          if sum(sum(x["action_bytes_including_terminator"] for x in row["embedded_action_records"])
                 for row in result["buttons"]) != result["embedded_action_bytes"]:
              raise SystemExit("Button action byte accounting mismatch")
          PY

      - name: Audit original embedded button ActionRecord opcodes (metadata only)
        run: |
          python3 tools/build_button_opcode_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --buttons build/swf-analysis/button-action-evidence.json \
            --output build/swf-analysis/button-opcode-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          m = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          b = json.loads((root / "button-action-evidence.json").read_text(encoding="utf-8"))
          d = json.loads((root / "button-opcode-evidence.json").read_text(encoding="utf-8"))
          if d["source_sha256"] != m["source"]["sha256"] or d["source_sha256"] != b["source_sha256"]:
              raise SystemExit("Button opcode source provenance mismatch")
          if d["button_definition_count"] != b["define_button2_count"]:
              raise SystemExit("Button opcode definition coverage mismatch")
          if d["embedded_action_record_count"] != b["embedded_action_record_count"] or len(d["records"]) != b["embedded_action_record_count"]:
              raise SystemExit("Button opcode record coverage mismatch")
          if d["embedded_action_bytes"] != b["embedded_action_bytes"]:
              raise SystemExit("Button opcode byte accounting mismatch")
          if sum(d["opcode_histogram"].values()) != d["parsed_opcode_count"]:
              raise SystemExit("Button opcode histogram mismatch")
          if sum(d["parse_status_counts"].values()) != d["embedded_action_record_count"]:
              raise SystemExit("Button opcode parse-status coverage mismatch")
          if sum(x["unparsed_tail_bytes"] for x in d["records"]) != d["unparsed_tail_bytes"]:
              raise SystemExit("Button opcode unparsed byte mismatch")
          PY

      - name: Join verified button actions with static timeline placements (metadata only)
        run: |
          python3 tools/build_button_placement_crosswalk.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --buttons build/swf-analysis/button-action-evidence.json \
            --timeline build/swf-analysis/timeline-index.json \
            --output build/swf-analysis/button-placement-crosswalk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          manifest = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          buttons = json.loads((root / "button-action-evidence.json").read_text(encoding="utf-8"))
          report = json.loads((root / "button-placement-crosswalk.json").read_text(encoding="utf-8"))
          if report["source_sha256"] != manifest["source"]["sha256"] or report["source_sha256"] != buttons["source_sha256"]:
              raise SystemExit("Button placement provenance mismatch")
          if report["button_definition_count"] != buttons["define_button2_count"]:
              raise SystemExit("Button definition count mismatch")
          if report["buttons_with_actions"] != buttons["buttons_with_actions"]:
              raise SystemExit("Action-bearing button count mismatch")
          if sum(x["static_placement_count"] for x in report["buttons"]) != report["static_placement_count"]:
              raise SystemExit("Button placement accounting mismatch")
          if report["main_timeline_placement_count"] + report["nested_timeline_placement_count"] != report["static_placement_count"]:
              raise SystemExit("Button placement timeline accounting mismatch")
          if report["buttons_with_static_placement"] + report["buttons_without_static_placement"] != report["button_definition_count"]:
              raise SystemExit("Button placement coverage mismatch")
          if sum(report["raw_button_condition_flags_histogram"].values()) != buttons["embedded_action_record_count"]:
              raise SystemExit("Button raw condition flag coverage mismatch")
          classes = report["button_condition_trigger_class_counts"]
          if set(classes) != {"transition_only", "key_only", "both", "neither"} or sum(classes.values()) != buttons["embedded_action_record_count"]:
              raise SystemExit("Button condition trigger class accounting mismatch")
          key_codes = report["encoded_button_key_code_histogram"]
          if sum(key_codes.values()) != classes["key_only"] + classes["both"]:
              raise SystemExit("Button encoded key-code accounting mismatch")
          if any(not str(k).isdigit() or not 1 <= int(k) <= 127 for k in key_codes):
              raise SystemExit("Invalid encoded button key code")
          transitions = report["decoded_button_transition_counts"]
          if len(transitions) != 9 or any(not 0 <= n <= buttons["embedded_action_record_count"] for n in transitions.values()):
              raise SystemExit("Button transition bit accounting mismatch")
          if sum(transitions.values()) < classes["transition_only"] + classes["both"]:
              raise SystemExit("Button transition trigger coverage mismatch")
          contexts = report["placement_same_frame_context_counts"]
          if set(contexts) != {"neither", "label_only", "script_only", "both"} or sum(contexts.values()) != report["static_placement_count"]:
              raise SystemExit("Button UI frame context accounting mismatch")
          PY

      - name: Build original legacy action opcode evidence (metadata only)
        run: |
          python3 tools/build_as2_action_opcode_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/as2-action-opcode-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          scripts = json.loads((root / "script-entry-evidence.json").read_text(encoding="utf-8"))
          d = json.loads((root / "as2-action-opcode-evidence.json").read_text(encoding="utf-8"))
          if d["source_sha256"] != scripts["source_sha256"]:
              raise SystemExit("Legacy action provenance mismatch")
          if d["legacy_container_count"] != scripts["legacy_action_container_count"]:
              raise SystemExit("Legacy action container accounting mismatch")
          if d["action_record_count_top_level"] != sum(d["opcode_counts"].values()):
              raise SystemExit("Legacy opcode count mismatch")
          if len(d["entries"]) != d["legacy_container_count"]:
              raise SystemExit("Legacy action entry coverage mismatch")
          if sum(d["trailing_class_counts"].values()) != d["legacy_container_count"]:
              raise SystemExit("Legacy action trailing class coverage mismatch")
          if d["trailing_bytes_total"] != sum(d["trailing_bytes_by_class"].values()):
              raise SystemExit("Legacy action trailing byte accounting mismatch")
          if d["containers_with_trailing_bytes"] != sum(
                  v for k, v in d["trailing_class_counts"].items() if k != "none"):
              raise SystemExit("Legacy action trailing container count mismatch")
          if d["containers_with_trailing_bytes"] != sum(d["trailing_length_histogram"].values()):
              raise SystemExit("Legacy action trailing length histogram mismatch")
          eleven = d["trailing_length_histogram"].get("11", 0)
          for field in ("trailing_length_11_zero_position_masks",
                        "trailing_length_11_zero_count_histogram",
                        "trailing_length_11_by_tag_code"):
              if sum(d[field].values()) != eleven:
                  raise SystemExit(f"Legacy action length-11 accounting mismatch: {field}")
          if any(len(mask) != 11 or set(mask) - {"0", "x"}
                 for mask in d["trailing_length_11_zero_position_masks"]):
              raise SystemExit("Invalid length-11 zero-position mask")
          walk = d["trailing_length_11_candidate_walk_status"]
          if set(walk) != {"terminated_at_end", "terminated_with_remainder",
                           "no_terminator", "invalid_record_boundary"}:
              raise SystemExit("Unexpected length-11 candidate walk status")
          if sum(walk.values()) != eleven:
              raise SystemExit("Length-11 candidate walk coverage mismatch")
          if sum(d["trailing_length_11_candidate_record_count_histogram"].values()) != (
                  eleven - walk["invalid_record_boundary"]):
              raise SystemExit("Length-11 candidate record histogram mismatch")
          shapes = d["trailing_length_11_candidate_record_shape_histogram"]
          if sum(shapes.values()) != walk["terminated_at_end"]:
              raise SystemExit("Length-11 terminated record-shape coverage mismatch")
          if any(not shape or any(
                  not (part == "S" or (part.startswith("L") and part[1:].isdigit()))
                  for part in shape.split(">")) for shape in shapes):
              raise SystemExit("Invalid length-11 record-shape metadata")
          for count in {len(shape.split(">")) for shape in shapes}:
              if sum(value for shape, value in shapes.items()
                     if len(shape.split(">")) == count) > d[
                         "trailing_length_11_candidate_record_count_histogram"].get(str(count), 0):
                  raise SystemExit("Length-11 record shape/count mismatch")
          PY

      - name: Check bounded ActionEnd tail operand compatibility (metadata only)
        run: |
          python3 tools/build_action_tail_opcode_compatibility.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/action-tail-opcode-compatibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          prior = json.loads((root / "as2-action-opcode-evidence.json").read_text(encoding="utf-8"))
          result = json.loads((root / "action-tail-opcode-compatibility.json").read_text(encoding="utf-8"))
          if result["source_sha256"] != prior["source_sha256"]:
              raise SystemExit("Tail operand provenance mismatch")
          if result["legacy_container_count"] != prior["legacy_container_count"]:
              raise SystemExit("Tail operand legacy container coverage mismatch")
          length11 = prior["trailing_length_histogram"].get("11", 0)
          eligible = prior["trailing_length_11_candidate_record_shape_histogram"].get("L2>L2", 0)
          if result["trailing_length_11_count"] != length11:
              raise SystemExit("Tail operand length-11 sample mismatch")
          if result["l2_l2_end_candidate_count"] != eligible:
              raise SystemExit("Tail operand eligible shape mismatch")
          if result["other_shape_count"] + eligible != length11:
              raise SystemExit("Tail operand excluded-shape accounting mismatch")
          if result["candidate_record_count"] != 2 * eligible:
              raise SystemExit("Tail operand record accounting mismatch")
          classes = result["candidate_record_class_histogram"]
          expected = {"fixed_length_match", "fixed_length_mismatch",
                      "push_payload_well_formed", "push_payload_invalid",
                      "known_variable_payload_unchecked", "unlisted_long_opcode"}
          if set(classes) != expected or sum(classes.values()) != 2 * eligible:
              raise SystemExit("Tail operand classification coverage mismatch")
          pairs = result["candidate_pair_class_histogram"]
          if sum(pairs.values()) != eligible or any(
                  len(pair.split(">")) != 2 or set(pair.split(">")) - expected
                  for pair in pairs):
              raise SystemExit("Tail operand pair accounting mismatch")
          if sum(result["candidate_by_tag_code"].values()) != eligible:
              raise SystemExit("Tail operand tag accounting mismatch")
          if set(result["candidate_by_tag_code"]) - {"12", "59"}:
              raise SystemExit("Unexpected tail operand tag type")
          kinds = result["candidate_action_kind_histogram"]
          if set(kinds) != {"goto_frame", "jump", "if", "other"}:
              raise SystemExit("Unexpected tail action kinds")
          if sum(kinds.values()) != result["candidate_record_count"]:
              raise SystemExit("Tail action-kind accounting mismatch")
          targets = result["candidate_branch_target_histogram"]
          if set(targets) != {"record_boundary", "record_interior", "before_tail", "after_tail"}:
              raise SystemExit("Unexpected candidate branch targets")
          if sum(targets.values()) != kinds["jump"] + kinds["if"]:
              raise SystemExit("Tail candidate branch target accounting mismatch")
          pre_kinds = result["pre_end_branch_kind_histogram"]
          if set(pre_kinds) != {"jump", "if"} or sum(pre_kinds.values()) != result["pre_end_branch_count"]:
              raise SystemExit("Pre-End branch kind accounting mismatch")
          pre_targets = result["pre_end_branch_target_histogram"]
          if set(pre_targets) != {"record_boundary", "record_interior", "first_action_end",
                                  "before_first_action_end", "outside_before", "outside_after"}:
              raise SystemExit("Unexpected pre-End branch targets")
          if sum(pre_targets.values()) != result["pre_end_branch_count"]:
              raise SystemExit("Pre-End branch target accounting mismatch")
          reach = result["candidate_tail_static_reachability_histogram"]
          if set(reach) != {"0", "1", "2"} or sum(reach.values()) != eligible:
              raise SystemExit("Tail static graph coverage mismatch")
          for key in ("candidate_tail_end_static_reachable_count",
                      "candidate_first_end_static_reachable_count"):
              if not 0 <= result[key] <= eligible:
                  raise SystemExit(f"Tail static graph bound mismatch: {key}")
          if not 0 <= result["candidate_reachable_pre_end_to_tail_boundary_edges"] <= result["candidate_pre_end_to_tail_boundary_edges"]:
              raise SystemExit("Tail static graph edge accounting mismatch")
          if result["candidate_unresolved_branch_edges"] < 0:
              raise SystemExit("Tail static graph unresolved edge accounting mismatch")
          expected_unresolved = {"pre_end_record_interior", "tail_record_interior",
                                 "outside_before", "outside_after", "invalid_operand_length"}
          all_unresolved = result["candidate_unresolved_branch_target_histogram"]
          reachable_unresolved = result["candidate_reachable_unresolved_branch_target_histogram"]
          if set(all_unresolved) != expected_unresolved or set(reachable_unresolved) != expected_unresolved:
              raise SystemExit("Unexpected unresolved branch target categories")
          if sum(all_unresolved.values()) != result["candidate_unresolved_branch_edges"]:
              raise SystemExit("Unresolved branch category accounting mismatch")
          if any(not isinstance(all_unresolved[k], int) or
                 not isinstance(reachable_unresolved[k], int) or
                 not 0 <= reachable_unresolved[k] <= all_unresolved[k]
                 for k in expected_unresolved):
              raise SystemExit("Reachable unresolved branch category bounds mismatch")
          regions = result["candidate_unresolved_pre_end_interior_region_histogram"]
          if set(regions) != {"length_field", "payload", "unclassified"}:
              raise SystemExit("Unexpected pre-End record interior region classes")
          if any(not isinstance(v, int) or v < 0 for v in regions.values()):
              raise SystemExit("Invalid pre-End record interior region counts")
          if sum(regions.values()) != all_unresolved["pre_end_record_interior"]:
              raise SystemExit("Pre-End record interior region accounting mismatch")
          PY

      - name: Cross-reference original StartSound and script containers by timeline/frame
        run: |
          python3 tools/build_sound_script_crosswalk.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --sound build/swf-analysis/sound-evidence.json \
            --scripts build/swf-analysis/script-entry-evidence.json \
            --output build/swf-analysis/sound-script-crosswalk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          m = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          s = json.loads((root / "sound-script-crosswalk.json").read_text(encoding="utf-8"))
          if s["source_sha256"] != m["source"]["sha256"]:
              raise SystemExit("Crosswalk SWF provenance mismatch")
          if s["start_sound_count"] != m["tag_counts_by_code"].get("15", 0):
              raise SystemExit("Crosswalk StartSound count mismatch")
          if s["sound_events_with_same_frame_scripts"] + s["sound_events_without_same_frame_scripts"] != s["start_sound_count"]:
              raise SystemExit("Crosswalk co-location accounting mismatch")
          if sum(e["same_frame_script_container_count"] for e in s["events"]) != s["same_frame_sound_script_pairs"]:
              raise SystemExit("Crosswalk pair accounting mismatch")
          PY

      - name: Build byte-verified display depth snapshots (metadata only)
        run: |
          python3 tools/build_display_depth_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/display-depth-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          m = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          d = json.loads((root / "display-depth-evidence.json").read_text(encoding="utf-8"))
          if d["source_sha256"] != m["source"]["sha256"]:
              raise SystemExit("Display-depth provenance mismatch")
          if d["show_frame_count"] != m["tag_counts_by_code"].get("1", 0):
              raise SystemExit("Display-depth ShowFrame accounting mismatch")
          if d["display_event_count"] != sum(m["tag_counts_by_code"].get(str(k), 0) for k in (4, 5, 26, 28, 70)):
              raise SystemExit("Display-depth event accounting mismatch")
          if d["timeline_count"] != len(d["timelines"]):
              raise SystemExit("Display-depth timeline accounting mismatch")
          PY

      - name: Audit declared versus observed ShowFrame counts (metadata only)
        run: |
          python3 tools/build_frame_count_audit.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --depth build/swf-analysis/display-depth-evidence.json \
            --output build/swf-analysis/frame-count-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          d = json.loads((root / "display-depth-evidence.json").read_text(encoding="utf-8"))
          a = json.loads((root / "frame-count-audit.json").read_text(encoding="utf-8"))
          if a["source_sha256"] != d["source_sha256"]:
              raise SystemExit("Frame audit SWF provenance mismatch")
          if a["timeline_count"] != d["timeline_count"] or a["show_frame_count"] != d["show_frame_count"]:
              raise SystemExit("Frame audit total accounting mismatch")
          if a["mismatch_count"] != d["frame_count_mismatch_timelines"]:
              raise SystemExit("Frame audit mismatch count disagrees with depth evidence")
          if sum(a["mismatch_direction_counts"].values()) != a["mismatch_count"]:
              raise SystemExit("Frame audit direction accounting mismatch")
          if sum(a["delta_histogram"].values()) != a["mismatch_count"]:
              raise SystemExit("Frame audit delta accounting mismatch")
          PY

      - name: Classify tags after final ShowFrame on discrepant timelines
        run: |
          python3 tools/build_frame_tail_evidence.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --audit build/swf-analysis/frame-count-audit.json \
            --output build/swf-analysis/frame-tail-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          a = json.loads((root / "frame-count-audit.json").read_text(encoding="utf-8"))
          t = json.loads((root / "frame-tail-evidence.json").read_text(encoding="utf-8"))
          if t["source_sha256"] != a["source_sha256"]:
              raise SystemExit("Frame-tail source mismatch")
          if t["mismatch_count"] != a["mismatch_count"]:
              raise SystemExit("Frame-tail mismatch accounting error")
          if sum(t["tail_class_counts"].values()) != t["mismatch_count"]:
              raise SystemExit("Frame-tail classification accounting error")
          if sum(t["tail_tag_counts_by_code"].values()) != sum(
                  r["tags_between_last_show_and_end"] for r in t["mismatches"]):
              raise SystemExit("Frame-tail tag accounting error")
          PY

      - name: Cross-reference zero-ShowFrame sprite static linkage (metadata only)
        run: |
          python3 tools/build_zero_frame_sprite_references.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --tail build/swf-analysis/frame-tail-evidence.json \
            --output build/swf-analysis/zero-frame-sprite-references.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          m = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          t = json.loads((root / "frame-tail-evidence.json").read_text(encoding="utf-8"))
          r = json.loads((root / "zero-frame-sprite-references.json").read_text(encoding="utf-8"))
          if r["source_sha256"] != m["source"]["sha256"]:
              raise SystemExit("Zero-frame reference provenance mismatch")
          if r["zero_show_frame_sprite_count"] != len(r["sprites"]):
              raise SystemExit("Zero-frame sprite row accounting mismatch")
          if r["static_place_reference_count"] != sum(
                  x["static_place_reference_count"] for x in r["sprites"]):
              raise SystemExit("Zero-frame static placement accounting mismatch")
          if r["static_init_action_reference_count"] != sum(
                  x["static_init_action_reference_count"] for x in r["sprites"]):
              raise SystemExit("Zero-frame init action accounting mismatch")
          shown = {x["timeline"] for x in m["tags"] if x["tag_code"] == 1}
          expected = {x["character_id"] for x in m["tags"] if x["tag_code"] == 39
                      and f"sprite:{x['character_id']}" not in shown}
          if {x["sprite_character_id"] for x in r["sprites"]} != expected:
              raise SystemExit("Zero-frame Sprite inventory omits original definitions")
          if r["zero_sprites_in_frame_tail_mismatches"] != t["tail_class_counts"].get("no_show_frame", 0):
              raise SystemExit("Frame-tail zero-ShowFrame mismatch accounting error")
          if (r["zero_sprites_in_frame_tail_mismatches"]
                  + r["zero_sprites_with_matching_declared_frames"]
                  != r["zero_show_frame_sprite_count"]):
              raise SystemExit("Zero-frame declared/observed coverage accounting error")
          if sum(r["zero_sprite_declared_frame_counts"].values()) != len(expected):
              raise SystemExit("Zero-frame declaration histogram mismatch")
          PY

      - name: Join zero-ShowFrame sprites with verified DoInitAction script entries
        run: |
          python3 tools/build_zero_frame_init_crosswalk.py \
            --manifest build/swf-analysis/swf-manifest.json \
            --zero build/swf-analysis/zero-frame-sprite-references.json \
            --scripts build/swf-analysis/script-entry-evidence.json \
            --output build/swf-analysis/zero-frame-init-crosswalk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/swf-analysis")
          z = json.loads((root / "zero-frame-sprite-references.json").read_text(encoding="utf-8"))
          s = json.loads((root / "script-entry-evidence.json").read_text(encoding="utf-8"))
          c = json.loads((root / "zero-frame-init-crosswalk.json").read_text(encoding="utf-8"))
          if c["source_sha256"] != z["source_sha256"] or c["source_sha256"] != s["source_sha256"]:
              raise SystemExit("Zero-frame init crosswalk provenance mismatch")
          if c["matched_init_script_count"] != z["static_init_action_reference_count"]:
              raise SystemExit("Zero-frame init crosswalk count mismatch")
          if len(c["entries"]) != c["matched_init_script_count"]:
              raise SystemExit("Zero-frame init crosswalk entry count mismatch")
          PY

      - name: Validate unknown tag 253/255 headers and produce metadata-only evidence
        run: |
          python3 tools/build_unknown_tag_evidence.py \
            --swf 拳皇wing1.4.swf \
            --manifest build/swf-analysis/swf-manifest.json \
            --output build/swf-analysis/unknown-tag-evidence.json

      - name: Run expensive AS1/AS2 and link diagnostics (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'deep'
        run: python3 tools/analyze_swf.py --phase deep --timeout 120 --output build/swf-analysis

      - name: Export ActionScript sources (manual, not published)
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'scripts'
        run: python3 tools/analyze_swf.py --phase scripts --timeout 120 --output build/swf-analysis

      - name: Export additional original assets (manual, not published)
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'assets'
        run: python3 tools/analyze_swf.py --phase assets --timeout 120 --output build/swf-analysis

      - name: Upload JSON metadata only (no raw tag logs or source bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swf-analysis
          path: |
            build/swf-analysis/*.json
          if-no-files-found: warn
          retention-days: 7
