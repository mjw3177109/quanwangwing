name: M1 bounded deep FFDec diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-deep-diagnostics
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original SWF and repository FFDec
        uses: actions/checkout@v4

      - name: Set up Java 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Verify Java 1.8
        run: java -version

      - name: Test metadata-only deep diagnostic summary
        run: python3 -m unittest discover -s tests -p 'test_summarize_deep_diagnostics.py' -v

      - name: Run bounded AS1/AS2/AS3 and link-report diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_swf.py --phase deep --timeout 180 --output build/deep-probe &
          probe_pid=$!
          (
            while kill -0 "$probe_pid" 2>/dev/null; do
              # Aggregate Java process statistics only; never print argv or source.
              ps -eo comm=,pcpu=,rss= | awk '$1=="java" {n++; cpu+=$2; rss+=$3} END {printf "[FFDEC-PROBE] java_processes=%d cpu_percent_sum=%.1f rss_kib_sum=%.0f\n", n, cpu, rss}'
              # Sample JVM thread STATES only; never emit raw stack traces, names or arguments.
              # A bounded jstack avoids hanging the monitoring loop if JVM attach stalls.
              java_pid="$(ps -eo pid=,comm= | awk '$2=="java" {print $1; exit}')"
              if [ -n "$java_pid" ] && command -v jstack >/dev/null 2>&1; then
                thread_dump="$(mktemp)"
                if timeout 5s jstack "$java_pid" >"$thread_dump" 2>/dev/null; then
                  awk '/java.lang.Thread.State:/ {states[$2]++} END {
                    printf "[FFDEC-THREADS] runnable=%d waiting=%d timed_waiting=%d blocked=%d total=%d\n",
                      states["RUNNABLE"]+0, states["WAITING"]+0,
                      states["TIMED_WAITING"]+0, states["BLOCKED"]+0,
                      states["RUNNABLE"]+states["WAITING"]+states["TIMED_WAITING"]+states["BLOCKED"]
                  }' "$thread_dump"
                else
                  echo '[FFDEC-THREADS] sampling_unavailable'
                fi
                rm -f "$thread_dump"
              fi
              for name in as1_as2 link_report; do
                file="build/deep-probe/${name}.log"
                if [ -f "$file" ]; then
                  printf '[FFDEC-PROBE] %s_log_bytes=%s\n' "$name" "$(stat -c %s "$file")"
                fi
              done
              sleep 15
            done
          ) &
          monitor_pid=$!
          set +e
          wait "$probe_pid"
          probe_status=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          exit "$probe_status"

      - name: Summarize command outcomes without source or report contents
        if: always()
        run: python3 tools/summarize_deep_diagnostics.py --summary build/deep-probe/summary.json --output build/deep-probe/deep-summary-metadata.json

      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-deep-diagnostics
          path: build/deep-probe/deep-summary-metadata.json
          if-no-files-found: error
          retention-days: 7
