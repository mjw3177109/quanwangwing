name: M1 bounded deep FFDec diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-deep-diagnostics
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original SWF and repository FFDec
        uses: actions/checkout@v4

      - name: Set up Java 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Verify Java 1.8
        run: java -version

      - name: Test metadata-only deep diagnostic summary
        run: python3 -m unittest discover -s tests -p 'test_summarize_deep_diagnostics.py' -v

      - name: Run bounded AS1/AS2/AS3 and link-report diagnostics
        run: python3 tools/analyze_swf.py --phase deep --timeout 180 --output build/deep-probe

      - name: Summarize command outcomes without source or report contents
        if: always()
        run: python3 tools/summarize_deep_diagnostics.py --summary build/deep-probe/summary.json --output build/deep-probe/deep-summary-metadata.json

      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-deep-diagnostics
          path: build/deep-probe/deep-summary-metadata.json
          if-no-files-found: error
          retention-days: 7
