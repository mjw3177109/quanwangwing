name: M1 AS2 export diagnostic (source stays on runner)

on:
  push:
    branches: [feature/m1-as2-export-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-as2-export-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original SWF and FFDec
        uses: actions/checkout@v4

      - name: Set up Java 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Verify Java
        run: java -version

      - name: Export ActionScript with bounded timeout
        run: python3 tools/analyze_swf.py --phase scripts --timeout 45 --output build/as2-probe

      - name: Validate export count without publishing source
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          export_root = root / "exports" / "scripts"
          files = sorted(p for p in export_root.rglob("*") if p.is_file())
          records = [
              {"path": p.relative_to(export_root).as_posix(),
               "size_bytes": p.stat().st_size,
               "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in files
          ]
          empty = [r["path"] for r in records if r["size_bytes"] == 0]
          index = {
              "source_sha256": summary["source"]["sha256"],
              "script_count": len(records),
              "total_bytes": sum(r["size_bytes"] for r in records),
              "empty_count": len(empty),
              "files": records,
              "note": "Metadata hashes only; no original AS2 source is published."
          }
          (root / "script-export-index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"scripts_complete": summary["scripts_complete"],
                            "exported_file_count": len(files),
                            "empty_count": len(empty),
                            "total_bytes": index["total_bytes"]}, ensure_ascii=False))
          if not summary["scripts_complete"] or len(files) != 7054 or empty:
              raise SystemExit("Expected 7054 non-empty AS2 exports from verified original SWF")
          PY

      - name: Report bounded error metadata only
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          summary_path = root / "summary.json"
          if summary_path.is_file():
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              print(json.dumps({"phase": data.get("phase"),
                                "scripts_complete": data.get("scripts_complete"),
                                "exported_file_count": data.get("exported_file_count"),
                                "commands": data.get("commands")}, ensure_ascii=False))
          else:
              print("No summary produced; inspect setup/runner failure.")
          PY

      - name: Upload metadata only (never source or raw export logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as2-probe-metadata
          path: |
            build/as2-probe/summary.json
            build/as2-probe/script-export-index.json
          if-no-files-found: warn
          retention-days: 7
