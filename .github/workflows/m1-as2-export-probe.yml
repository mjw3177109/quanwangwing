name: M1 AS2 export diagnostic (source stays on runner)

on:
  push:
    branches: [feature/m1-as2-export-probe, feature/m1-as2-semantic-map, feature/m1-as2-assigned-function-evidence]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-as2-export-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original SWF and FFDec
        uses: actions/checkout@v4

      - name: Set up Java 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Verify Java
        run: java -version

      - name: Export ActionScript with bounded retry for partial FFDec output
        run: |
          for attempt in 1 2 3; do
            echo "FFDec export attempt $attempt/3"
            if python3 tools/analyze_swf.py --phase scripts --timeout 45 --output build/as2-probe; then
              if python3 - <<'PY'
          from pathlib import Path
          root = Path("build/as2-probe/exports/scripts")
          files = [p for p in root.rglob("*") if p.is_file()]
          empty = sum(p.stat().st_size == 0 for p in files)
          core = root / "scripts/__Packages/role_corn/Role.as"
          core_bytes = core.stat().st_size if core.is_file() else 0
          print(f"Preflight: scripts={len(files)}, empty={empty}, Role.as={core_bytes} bytes")
          if len(files) != 7054 or empty != 126 or core_bytes < 100000:
              raise SystemExit("Partial FFDec export detected; full validation remains mandatory")
          PY
              then
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "FFDec export remained incomplete after 3 attempts"
              exit 1
            fi
            rm -rf build/as2-probe/exports/scripts
          done

      - name: Validate export count without publishing source
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import sys
          from collections import defaultdict
          from pathlib import Path
          sys.path.insert(0, "tools")
          from swf_inventory import load_swf
          root = Path("build/as2-probe")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          export_root = root / "exports" / "scripts"
          files = sorted(p for p in export_root.rglob("*") if p.is_file())
          records = [
              {"path": p.relative_to(export_root).as_posix(),
               "size_bytes": p.stat().st_size,
               "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in files
          ]
          empty = [r["path"] for r in records if r["size_bytes"] == 0]
          swf_bytes, _ = load_swf(Path("拳皇wing1.4.swf"))
          swf_manifest = json.loads((root / "swf-manifest.json").read_text(encoding="utf-8"))
          actions = defaultdict(list)
          for tag in swf_manifest["tags"]:
              if tag["tag_code"] == 12:
                  actions[(tag["timeline"], tag["frame"])].append(tag)
          noops, unexpected = [], []
          for path in empty:
              match = re.fullmatch(
                  r"scripts/(?:DefineSprite_(\d+)(?:_[^/]*)?/)?frame_(\d+)/DoAction\.as",
                  path
              )
              if match is None:
                  unexpected.append(path)
                  continue
              timeline = "sprite:" + match.group(1) if match.group(1) else "main"
              source_tags = actions[(timeline, int(match.group(2)) - 1)]
              if (len(source_tags) == 1 and source_tags[0]["length"] == 1
                      and swf_bytes[source_tags[0]["body_offset_uncompressed"]] == 0):
                  noops.append(path)
              else:
                  unexpected.append(path)
          index = {
              "source_sha256": summary["source"]["sha256"],
              "script_count": len(records),
              "total_bytes": sum(r["size_bytes"] for r in records),
              "empty_count": len(empty),
              "verified_noop_empty_count": len(noops),
              "unexpected_empty_count": len(unexpected),
              "verified_noop_paths": noops,
              "unexpected_empty_paths": unexpected,
              "files": records,
              "note": "Metadata hashes only; no original AS2 source is published."
          }
          (root / "script-export-index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"scripts_complete": summary["scripts_complete"],
                            "exported_file_count": len(files),
                            "empty_count": len(empty),
                            "verified_noop_empty_count": len(noops),
                            "unexpected_empty_count": len(unexpected),
                            "total_bytes": index["total_bytes"]}, ensure_ascii=False))
          if not summary["scripts_complete"] or len(files) != 7054 or unexpected:
              raise SystemExit("AS2 exports incomplete or unexplained empty files remain")
          PY

      - name: Build SWF ExportAssets candidate index
        run: python3 tools/build_asset_index.py --manifest build/as2-probe/swf-manifest.json --output build/as2-probe/asset-index.json

      - name: Cross-reference zero-ShowFrame sprites with verified AS2 class paths
        run: |
          python3 tools/build_zero_frame_as2_class_links.py \
            --manifest build/as2-probe/swf-manifest.json \
            --asset-index build/as2-probe/asset-index.json \
            --export-index build/as2-probe/script-export-index.json \
            --output build/as2-probe/zero-frame-as2-class-links.json
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          d = json.loads((root / "zero-frame-as2-class-links.json").read_text(encoding="utf-8"))
          if sum(d["class_path_classifications"].values()) != d["zero_sprite_export_count"]:
              raise SystemExit("Zero-frame class path accounting mismatch")
          if len(d["entries"]) != d["zero_sprite_export_count"]:
              raise SystemExit("Zero-frame class link row accounting mismatch")
          if d["verified_as2_script_count"] != 7054:
              raise SystemExit("FFDec AS2 verified export coverage regression")
          if d["zero_sprite_init_tag_count"] != sum(
                  len(e["init_script_tags"]) for e in d["entries"]):
              raise SystemExit("Zero-frame init tag position accounting mismatch")
          if any(e["do_init_action_target_count"] != len(e["init_script_tags"])
                 for e in d["entries"]):
              raise SystemExit("DoInitAction per-sprite tag accounting mismatch")
          matched = {e["sprite_character_id"] for e in d["entries"]
                     if e["classification"] == "verified_path_match"
                     and e["init_script_tags"]}
          if len(matched) != d["zero_sprites_with_verified_class_and_init_tag"]:
              raise SystemExit("Class/init provenance join accounting mismatch")
          PYTEST

      - name: Verify AS2 sources and derive metadata-only semantic entry map
        run: |
          python3 tools/build_as2_semantic_index.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --asset-index build/as2-probe/asset-index.json \
            --output build/as2-probe/as2-semantic-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("build/as2-probe/as2-semantic-index.json").read_text(encoding="utf-8"))
          roles = d["role_script_candidates"]
          if len(roles) != 16 or any(not r["export_present"] for r in roles):
              raise SystemExit("Expected 16 original base/Type2 role candidate scripts")
          if d["verified_script_count"] != 7054:
              raise SystemExit("AS2 export count regression")
          core = [s for s in d["candidate_scripts"] if s.get("core_runtime_candidate")]
          if len(core) != 1 or core[0]["size_bytes"] < 100000:
              raise SystemExit("Critical Role.as was not included in semantic evidence")
          PY

      - name: Cross-reference verified role scripts with original sprite timelines
        run: |
          python3 tools/build_timeline_index.py \
            --manifest build/as2-probe/swf-manifest.json \
            --output build/as2-probe/timeline-index.json
          python3 tools/build_role_crosswalk.py \
            --asset-index build/as2-probe/asset-index.json \
            --timeline-index build/as2-probe/timeline-index.json \
            --semantic-index build/as2-probe/as2-semantic-index.json \
            --output build/as2-probe/role-crosswalk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/as2-probe/role-crosswalk.json").read_text(encoding="utf-8"))
          if data["role_variant_count"] != 16:
              raise SystemExit("Expected 16 original role variants")
          if data["linked_sprite_timeline_count"] + data["unlinked_sprite_timeline_count"] != 16:
              raise SystemExit("Sprite timeline accounting mismatch")
          PY

      - name: Extract hash-verified role timeline callsite candidates (metadata only)
        run: |
          python3 tools/build_role_timeline_call_evidence.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --role-crosswalk build/as2-probe/role-crosswalk.json \
            --output build/as2-probe/role-timeline-call-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          d = json.loads((root / "role-timeline-call-evidence.json").read_text(encoding="utf-8"))
          r = json.loads((root / "role-crosswalk.json").read_text(encoding="utf-8"))
          if d["source_sha256"] != r["source_sha256"] or d["role_variant_count"] != r["role_variant_count"]:
              raise SystemExit("Role timeline call provenance/count mismatch")
          if d["role_variant_count"] != 16 or len(d["roles"]) != 16:
              raise SystemExit("Role timeline call variant coverage mismatch")
          if sum(d["argument_kind_counts"].values()) != d["call_candidate_count"]:
              raise SystemExit("Role timeline call argument classification mismatch")
          if sum(d["receiver_kind_counts"].values()) != d["call_candidate_count"]:
              raise SystemExit("Role timeline call receiver classification mismatch")
          if any(c["receiver_kind"] not in d["receiver_kind_counts"]
                 for role in d["roles"] for c in role["calls"]):
              raise SystemExit("Role timeline call receiver class missing from summary")
          if sum(x["call_candidate_count"] for x in d["roles"]) != d["call_candidate_count"]:
              raise SystemExit("Role timeline call row accounting mismatch")
          if any(x["call_candidate_count"] != len(x["calls"]) for x in d["roles"]):
              raise SystemExit("Role timeline callsite row mismatch")
          PY

      - name: Join verified role callsites with lexical function scopes
        run: |
          python3 tools/build_role_call_scope_join.py \
            --role-crosswalk build/as2-probe/role-crosswalk.json \
            --call-evidence build/as2-probe/role-timeline-call-evidence.json \
            --output build/as2-probe/role-call-scope-join.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          j = json.loads((root / "role-call-scope-join.json").read_text(encoding="utf-8"))
          c = json.loads((root / "role-timeline-call-evidence.json").read_text(encoding="utf-8"))
          r = json.loads((root / "role-crosswalk.json").read_text(encoding="utf-8"))
          if j["source_sha256"] != c["source_sha256"] or j["source_sha256"] != r["source_sha256"]:
              raise SystemExit("Role call scope source provenance mismatch")
          if j["role_variant_count"] != c["role_variant_count"] or j["call_candidate_count"] != c["call_candidate_count"]:
              raise SystemExit("Role call scope coverage mismatch")
          if sum(j["scope_relation_counts"].values()) != j["call_candidate_count"]:
              raise SystemExit("Role call scope relation accounting mismatch")
          if sum(j["scope_kind_counts"].values()) != j["call_candidate_count"]:
              raise SystemExit("Role call scope kind accounting mismatch")
          if sum(len(role["calls"]) for role in j["roles"]) != j["call_candidate_count"]:
              raise SystemExit("Role call scope row accounting mismatch")
          if any(call["scope_relation"] == "unique" and call["scope_candidate_count"] != 1
                 for role in j["roles"] for call in role["calls"]):
              raise SystemExit("Role call scope unique interval mismatch")
          PY

      - name: Trace direct role placements and DoInitAction targets
        run: |
          python3 tools/build_role_reference_evidence.py \
            --crosswalk build/as2-probe/role-crosswalk.json \
            --timeline-index build/as2-probe/timeline-index.json \
            --output build/as2-probe/role-reference-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("build/as2-probe/role-reference-evidence.json").read_text(encoding="utf-8"))
          if d["role_variant_count"] != 16:
              raise SystemExit("Expected 16 verified role variants")
          if d["direct_placement_count"] != sum(r["direct_placement_count"] for r in d["roles"]):
              raise SystemExit("Placement accounting mismatch")
          if d["do_init_action_target_count"] != sum(r["do_init_action_target_count"] for r in d["roles"]):
              raise SystemExit("Initialization accounting mismatch")
          PY

      - name: Join role candidates with zero-frame init metadata
        run: |
          python3 tools/build_role_zero_frame_init_join.py \
            --roles build/as2-probe/role-reference-evidence.json \
            --zero build/as2-probe/zero-frame-as2-class-links.json \
            --output build/as2-probe/role-zero-frame-init-join.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/as2-probe")
          r = json.loads((p / "role-reference-evidence.json").read_text(encoding="utf-8"))
          j = json.loads((p / "role-zero-frame-init-join.json").read_text(encoding="utf-8"))
          if j["source_sha256"] != r["source_sha256"] or j["role_variant_count"] != r["role_variant_count"]:
              raise SystemExit("Role join source/count mismatch")
          if j["role_init_reference_count"] != r["do_init_action_target_count"]:
              raise SystemExit("Role init accounting mismatch")
          PY

      - name: Trace AS2 attachMovie linkage against verified ExportAssets
        run: |
          python3 tools/build_runtime_attach_evidence.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --asset-index build/as2-probe/asset-index.json \
            --crosswalk build/as2-probe/role-crosswalk.json \
            --semantic-index build/as2-probe/as2-semantic-index.json \
            --output build/as2-probe/runtime-attach-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("build/as2-probe/runtime-attach-evidence.json").read_text(encoding="utf-8"))
          if d["verified_script_count"] != 7054:
              raise SystemExit("AS2 source coverage regression")
          if sum(d["classification_counts"].values()) != d["attach_call_candidate_count"]:
              raise SystemExit("attachMovie classification accounting mismatch")
          if any(e["classification"] == "literal_export_match" and not e["matched_export_assets"] for e in d["events"]):
              raise SystemExit("Unresolved ExportAssets match")
          PY

      - name: Trace dynamic attachMovie argument and lexical assignment candidates
        run: |
          python3 tools/build_attach_argument_provenance.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --attach-evidence build/as2-probe/runtime-attach-evidence.json \
            --asset-index build/as2-probe/asset-index.json \
            --output build/as2-probe/attach-argument-provenance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("build/as2-probe/runtime-attach-evidence.json").read_text(encoding="utf-8"))
          d = json.loads(Path("build/as2-probe/attach-argument-provenance.json").read_text(encoding="utf-8"))
          if d["verified_script_count"] != 7054:
              raise SystemExit("AS2 source coverage regression")
          if d["dynamic_argument_count"] != a["classification_counts"].get("dynamic_or_unresolved", 0):
              raise SystemExit("Dynamic attachMovie argument accounting mismatch")
          if sum(d["argument_shape_counts"].values()) != d["dynamic_argument_count"]:
              raise SystemExit("Dynamic argument shape accounting mismatch")
          if any(e["argument_shape"] == "concatenation" and len(e["concatenation_components"]) < 2 for e in d["events"]):
              raise SystemExit("Concatenation component accounting mismatch")
          PY

      - name: Trace hashed identifiers across verified AS2 scripts
        run: |
          python3 tools/build_attach_identifier_references.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --provenance build/as2-probe/attach-argument-provenance.json \
            --output build/as2-probe/attach-identifier-references.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("build/as2-probe/attach-identifier-references.json").read_text(encoding="utf-8"))
          p = json.loads(Path("build/as2-probe/attach-argument-provenance.json").read_text(encoding="utf-8"))
          expected = {c["identifier_sha256"]
                      for e in p["events"]
                      for c in e.get("concatenation_components", [])
                      if c.get("kind") == "identifier"}
          expected.update(e["identifier_sha256"] for e in p["events"]
                          if e["argument_shape"] == "identifier")
          if d["verified_script_count"] != 7054 or d["identifier_target_count"] != len(expected):
              raise SystemExit("AS2 identifier reference coverage mismatch")
          if {t["identifier_sha256"] for t in d["targets"]} != expected:
              raise SystemExit("Hashed identifier target mismatch")
          if sum(t["occurrence_count"] for t in d["targets"]) != d["identifier_occurrence_count"]:
              raise SystemExit("Identifier occurrence accounting mismatch")
          if any(t["occurrence_count"] < 1 or t["runtime_binding_verified"] for t in d["targets"]):
              raise SystemExit("Unverified identifier reference incorrectly classified")
          if any(sum(t["scope_context_counts"].values()) != t["occurrence_count"]
                 for t in d["targets"]):
              raise SystemExit("AS2 lexical scope context accounting mismatch")
          if any(e["scope_candidate"] and e["scope_candidate"]["runtime_binding_verified"]
                 for t in d["targets"] for e in t["examples"]):
              raise SystemExit("Unverified lexical scope classified as runtime binding")
          PY

      - name: Join dynamic attachMovie hashed references to role script evidence
        run: |
          python3 tools/build_dynamic_attach_reference_join.py \
            --provenance build/as2-probe/attach-argument-provenance.json \
            --references build/as2-probe/attach-identifier-references.json \
            --roles build/as2-probe/role-zero-frame-init-join.json \
            --output build/as2-probe/dynamic-attach-reference-join.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          d = json.loads((root / "dynamic-attach-reference-join.json").read_text(encoding="utf-8"))
          p = json.loads((root / "attach-argument-provenance.json").read_text(encoding="utf-8"))
          r = json.loads((root / "attach-identifier-references.json").read_text(encoding="utf-8"))
          if d["dynamic_attach_count"] != p["dynamic_argument_count"]:
              raise SystemExit("Dynamic attach join coverage mismatch")
          if d["identifier_target_count"] != r["identifier_target_count"]:
              raise SystemExit("Identifier target join coverage mismatch")
          if d["identifier_occurrence_count"] != r["identifier_occurrence_count"]:
              raise SystemExit("Identifier occurrence join coverage mismatch")
          if any(e["runtime_binding_verified"] for e in d["events"]):
              raise SystemExit("Unverified dynamic binding classified as verified")
          PY

      - name: Audit lexical proximity of unresolved attachMovie identifiers
        run: |
          python3 tools/build_dynamic_attach_scope_pairs.py \
            --references build/as2-probe/attach-identifier-references.json \
            --joined build/as2-probe/dynamic-attach-reference-join.json \
            --output build/as2-probe/dynamic-attach-scope-pairs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/as2-probe")
          d = json.loads((p / "dynamic-attach-scope-pairs.json").read_text(encoding="utf-8"))
          r = json.loads((p / "attach-identifier-references.json").read_text(encoding="utf-8"))
          if d["identifier_target_count"] != r["identifier_target_count"]:
              raise SystemExit("Scope-pair target coverage mismatch")
          if d["identifier_occurrence_count"] != r["identifier_occurrence_count"]:
              raise SystemExit("Scope-pair occurrence coverage mismatch")
          if not (d["shared_scripts_with_gap_at_most_2"] <= d["shared_scripts_with_gap_at_most_5"] <= d["shared_script_count"]):
              raise SystemExit("Scope-pair distance accounting mismatch")
          if len(d["pairs"]) != d["shared_script_count"]:
              raise SystemExit("Scope-pair row accounting mismatch")
          if any(row["runtime_binding_verified"] for row in d["pairs"]):
              raise SystemExit("Unverified runtime binding claim")
          PY

      - name: Audit lexical assignment syntax of unresolved attachMovie identifiers
        run: |
          python3 tools/build_dynamic_attach_assignment_sites.py \
            --scripts build/as2-probe/exports/scripts \
            --export-index build/as2-probe/script-export-index.json \
            --references build/as2-probe/attach-identifier-references.json \
            --output build/as2-probe/dynamic-attach-assignment-sites.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/as2-probe")
          d = json.loads((p / "dynamic-attach-assignment-sites.json").read_text(encoding="utf-8"))
          r = json.loads((p / "attach-identifier-references.json").read_text(encoding="utf-8"))
          if d["identifier_target_count"] != r["identifier_target_count"]:
              raise SystemExit("Assignment target coverage mismatch")
          if d["identifier_occurrence_count"] != r["identifier_occurrence_count"]:
              raise SystemExit("Assignment reference coverage mismatch")
          if sum(d["lhs_class_counts"].values()) != d["assignment_candidate_count"]:
              raise SystemExit("Assignment LHS accounting mismatch")
          if sum(d["rhs_class_counts"].values()) != d["assignment_candidate_count"]:
              raise SystemExit("Assignment RHS accounting mismatch")
          if len(d["sites"]) != d["assignment_candidate_count"]:
              raise SystemExit("Assignment row accounting mismatch")
          if any(s["runtime_binding_verified"] for s in d["sites"]):
              raise SystemExit("Unverified assignment binding claim")
          PY

      - name: Join hashed function assignment and cross-target body references
        run: |
          python3 tools/build_dynamic_attach_function_body_join.py \
            --assignments build/as2-probe/dynamic-attach-assignment-sites.json \
            --references build/as2-probe/attach-identifier-references.json \
            --joined build/as2-probe/dynamic-attach-reference-join.json \
            --output build/as2-probe/dynamic-attach-function-body-join.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/as2-probe")
          d = json.loads((p / "dynamic-attach-function-body-join.json").read_text(encoding="utf-8"))
          a = json.loads((p / "dynamic-attach-assignment-sites.json").read_text(encoding="utf-8"))
          if d["identifier_occurrence_count"] != a["identifier_occurrence_count"]:
              raise SystemExit("Function body join identifier accounting mismatch")
          if d["function_assignment_candidate_count"] != a["rhs_class_counts"].get("function_expression_candidate", 0):
              raise SystemExit("Function body assignment coverage mismatch")
          if d["cross_target_body_reference_count"] < d["cross_target_member_property_count"]:
              raise SystemExit("Function body member reference accounting mismatch")
          if any(s["runtime_binding_verified"] for s in d["sites"]):
              raise SystemExit("Unverified function binding claim")
          PY

      - name: Report bounded error metadata only
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/as2-probe")
          summary_path = root / "summary.json"
          if summary_path.is_file():
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              print(json.dumps({"phase": data.get("phase"),
                                "scripts_complete": data.get("scripts_complete"),
                                "exported_file_count": data.get("exported_file_count"),
                                "commands": data.get("commands")}, ensure_ascii=False))
          else:
              print("No summary produced; inspect setup/runner failure.")
          PY

      - name: Upload metadata only (never source or raw export logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as2-probe-metadata
          path: |
            build/as2-probe/summary.json
            build/as2-probe/script-export-index.json
            build/as2-probe/as2-semantic-index.json
            build/as2-probe/zero-frame-as2-class-links.json
            build/as2-probe/role-zero-frame-init-join.json
            build/as2-probe/role-crosswalk.json
            build/as2-probe/role-timeline-call-evidence.json
            build/as2-probe/role-call-scope-join.json
            build/as2-probe/role-reference-evidence.json
            build/as2-probe/runtime-attach-evidence.json
            build/as2-probe/attach-argument-provenance.json
